[package]
name = "agenterm-cli"
version = "0.20.7"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
ctrlc = "3"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows", "bracketed-paste"] }
fs2 = "0.4"
getrandom = "0.4"
httparse = "1"
native-tls = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[build-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The piped installer reopens stdin as /dev/tty. macOS kqueue cannot
# monitor that alias, so use crossterm's poll-based terminal event source.
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_WindowsProgramming"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
