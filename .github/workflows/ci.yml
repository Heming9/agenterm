name: Build checks

on:
  pull_request:
    paths:
      - 'tools/p2p-cli/**'
      - 'internal/p2p/**'
      - 'internal/client/**'
      - 'internal/protocol/**'
      - 'internal/service/**'
      - 'internal/components/**'
      - 'internal/installer/**'
      - 'cmd/agenterm-pack/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build_components.py'
      - 'scripts/build_p2p_cli.py'
      - 'scripts/p2p_cache.py'
      - 'scripts/build_server.py'
      - 'scripts/test_*.py'
      - 'scripts/release/**'
      - '.github/workflows/p2p-cli.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/checks.yml'
      - '.github/workflows/ci.yml'
  push:
    branches: ['**']
    paths:
      - 'tools/p2p-cli/**'
      - 'internal/p2p/**'
      - 'internal/client/**'
      - 'internal/protocol/**'
      - 'internal/service/**'
      - 'internal/components/**'
      - 'internal/installer/**'
      - 'cmd/agenterm-pack/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build_components.py'
      - 'scripts/build_p2p_cli.py'
      - 'scripts/p2p_cache.py'
      - 'scripts/build_server.py'
      - 'scripts/test_*.py'
      - 'scripts/release/**'
      - '.github/workflows/p2p-cli.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/checks.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: ${{ github.sha }}
