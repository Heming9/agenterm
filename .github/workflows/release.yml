name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
      - name: Build client
        run: |
          cd cmd/agenterm-gui
          "$(go env GOPATH)/bin/fyne" package -os darwin --use-raw-icon --release
          ditto -c -k --keepParent Agenterm.app ../../agenterm-client-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: agenterm-client-macos-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Add C compiler to PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
      - name: Build client
        shell: pwsh
        run: |
          Set-Location cmd/agenterm-gui
          & "$(go env GOPATH)/bin/fyne.exe" package -os windows -icon assets/app-icon-windows.png --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item Agenterm.exe ../../agenterm-client-windows-amd64.exe
          Compress-Archive -Path ../../agenterm-client-windows-amd64.exe -DestinationPath ../../agenterm-client-windows-amd64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            agenterm-client-windows-amd64.exe
            agenterm-client-windows-amd64.zip
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - name: Build server for macOS, Linux, and Windows
        env:
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              platform="$os"
              extension=""
              if [ "$os" = darwin ]; then platform=macos; fi
              if [ "$os" = windows ]; then extension=.exe; fi
              GOOS="$os" GOARCH="$arch" go build -ldflags "-X main.releaseTag=$RELEASE_TAG" -o "dist/agenterm-server-${platform}-${arch}${extension}" ./cmd/agenterm-server
              name="agenterm-cli-${platform}-${arch}${extension}"
              GOOS="$os" GOARCH="$arch" go build -ldflags '-s -w' -o "dist/$name" ./cmd/agenterm-client
              if [ "$os" = windows ]; then
                (cd dist && zip -q "${name%.exe}.zip" "$name")
              else
                tar -C dist -czf "dist/${name}.tar.gz" "$name"
              fi
            done
          done
          cp internal/installer/install.sh internal/installer/install.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [macos, windows, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum * > ../SHA256SUMS && mv ../SHA256SUMS .)
          gh release create "$TAG" artifacts/* --verify-tag --prerelease --title "Agenterm $TAG" --notes "$(cat <<'EOF'
          Agenterm preview release.

          - Client: graphical application for the computer where commands run (macOS arm64 and Windows amd64).
          - Server: MCP endpoint for macOS, Linux, and Windows (amd64 and arm64).
          - CLI client: macOS, Linux, and Windows (amd64 and arm64). The one-time invitation installer uses the CLI.

          Server and client must use the same token format; this release is incompatible with the older format. Update both together.

          HTTP and WebSocket traffic is unencrypted by default; use only on a trusted network. See the README for setup and security details.
          EOF
          )"
