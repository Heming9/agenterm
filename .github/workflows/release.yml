name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Programs to rebuild (CLI also rebuilds Server)'
        type: choice
        default: all
        options: [all, server, client, cli, gui]
      base_tag:
        description: 'Reuse from this release; blank selects latest published ancestor'
        type: string
        default: ''
      source_ref:
        description: 'Source commit or tag to rebuild; blank uses the workflow ref'
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      cli: ${{ steps.plan.outputs.cli }}
      server: ${{ steps.plan.outputs.server }}
      gui: ${{ steps.plan.outputs.gui }}
      unified: ${{ steps.layout.outputs.unified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Detect component layout at the selected source
        id: layout
        run: |
          if [ -f scripts/build_components.py ] && { [ -f internal/components/assets/components.tar.xz ] || [ -f internal/components/assets/components.zip ]; }; then
            echo 'unified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'unified=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Test release planning
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Select builds and verify reused downloads
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCOPE: ${{ inputs.scope || 'all' }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: python3 scripts/release/release.py prepare --scope "$SCOPE" --base "$BASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan/
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.gui == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
      - name: Test GUI client
        run: go test -gcflags=all=-l ./cmd/agenterm-client-gui
      - name: Build client
        run: |
          cd cmd/agenterm-client-gui
          "$(go env GOPATH)/bin/fyne" package -os darwin --use-raw-icon --release
          cp Agenterm.app/Contents/MacOS/Agenterm ../../agenterm-client-gui-macos-arm64
          chmod +x ../../agenterm-client-gui-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: agenterm-client-gui-macos-arm64
          if-no-files-found: error

  windows-tests:
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Test Windows installer and connection probes
        run: go test ./internal/service -run 'TestPowerShellInvitationInstaller|TestProbe|TestReleaseDownloads|TestInstallWrapper|TestConnectionVersion|TestHeartbeat'
      - name: Test Windows CLI client and reconnection
        run: go test -gcflags=all=-l ./cmd/agenterm-client-cli ./internal/client
      - name: Test MCP execution and session lifecycle on Windows
        run: go test ./internal/service -run 'TestExecution|TestMCPExecution|TestMultiDevice|TestMCPToolDiscovery|TestSession|TestConcurrentSessionControls|TestAllToolResultsMatchPublishedContracts'
      - name: Test deterministic download archives on Windows
        run: go test ./internal/installer -run 'TestDownload|TestBundle'

  windows:
    needs: plan
    if: needs.plan.outputs.gui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Add C compiler to PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
      - name: Build client
        shell: pwsh
        run: |
          Set-Location cmd/agenterm-client-gui
          & "$(go env GOPATH)/bin/fyne.exe" package -os windows -icon assets/app-icon-windows.png --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item Agenterm.exe ../../agenterm-client-gui-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: agenterm-client-gui-windows-amd64.exe
          if-no-files-found: error

  p2p:
    needs: plan
    if: needs.plan.outputs.server == 'true' && needs.plan.outputs.unified == 'true'
    uses: ./.github/workflows/p2p-cli.yml
    with:
      source_ref: ${{ needs.plan.outputs.sha }}

  server:
    needs: [plan, p2p]
    if: always() && needs.plan.result == 'success' && (needs.p2p.result == 'success' || needs.p2p.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-plan
      - name: Restore reusable CLI and Server files
        shell: bash
        run: |
          mkdir -p dist
          for asset in release-plan/reused/agenterm-client-cli-* release-plan/reused/agenterm-server-*; do
            [ ! -f "$asset" ] || cp "$asset" dist/
          done
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.server == 'true' && needs.plan.outputs.unified == 'true'
        with:
          name: p2p-cli-distribution
          path: component-builds/p2p-assets
      - name: Install legacy release compression tools
        if: needs.plan.outputs.server == 'true' && needs.plan.outputs.unified != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils
      - name: Test CLI, server, and installers
        run: go test -gcflags=all=-l ./cmd/agenterm-client-cli ./cmd/agenterm-server ./internal/...
      - name: Build or reuse CLI, bundle it, then build servers
        if: needs.plan.outputs.server == 'true'
        env:
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BUILD_CLI: ${{ needs.plan.outputs.cli }}
          UNIFIED_COMPONENTS: ${{ needs.plan.outputs.unified }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._+-]+$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          source_version=$(sed -n 's/^const Current = "\([^"]*\)"$/\1/p' internal/version/version.go)
          [ "$RELEASE_TAG" = "v$source_version" ] || { echo 'Release tag must match internal/version.Current' >&2; exit 1; }
          mkdir -p dist
          rm -f internal/installer/assets/agenterm-client-cli-* internal/installer/assets/SHA256SUMS
          if [ "$BUILD_CLI" = true ]; then
            for os in darwin linux windows; do
              for arch in amd64 arm64; do
                platform="$os"
                extension=""
                if [ "$os" = darwin ]; then platform=macos; fi
                if [ "$os" = windows ]; then extension=.exe; fi
                name="agenterm-client-cli-${platform}-${arch}${extension}"
                GOOS="$os" GOARCH="$arch" go build -trimpath -gcflags=all=-l -ldflags '-s -w' -o "dist/$name" ./cmd/agenterm-client-cli
              done
            done
          fi
          if [ "$UNIFIED_COMPONENTS" = true ]; then
            # One packer owns exact downloads and the archive embedded by every server.
            python3 scripts/build_components.py --client-dir dist --p2p-assets component-builds/p2p-assets --download-output "$RUNNER_TEMP/cli-downloads"
          else
            # Rebuild older source refs with their own packer and embedded layout.
            go run ./cmd/agenterm-pack -input dist -output dist -bundle "$RUNNER_TEMP/clients.tar"
            xz -9e -T1 -c "$RUNNER_TEMP/clients.tar" > internal/installer/assets/clients.tar.xz
          fi
          if [ "$UNIFIED_COMPONENTS" = true ]; then
            # Validate generated HTTP downloads, which are not Release attachments.
            AGENTERM_RELEASE_DIR="$RUNNER_TEMP/cli-downloads" go test ./internal/installer -run TestEmbeddedReleaseDownloads -count=1
          else
            AGENTERM_RELEASE_DIR="$PWD/dist" go test ./internal/installer -run TestEmbeddedReleaseDownloads -count=1
          fi
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              platform="$os"
              extension=""
              if [ "$os" = darwin ]; then platform=macos; fi
              if [ "$os" = windows ]; then extension=.exe; fi
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "dist/agenterm-server-${platform}-${arch}${extension}" ./cmd/agenterm-server
            done
          done
      - name: Stage raw executables for publication
        run: python3 scripts/release/release.py stage --directory dist --output release-files --components cli server
      - name: Report artifact sizes
        run: |
          {
            printf '| Executable | Bytes |\n| --- | ---: |\n'
            for artifact in release-files/*; do
              printf '| %s | %s |\n' "$(basename "$artifact")" "$(wc -c < "$artifact" | tr -d ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: build-server
          path: release-files/*
          if-no-files-found: error

  publish:
    needs: [plan, macos, windows, windows-tests, server]
    # GUI jobs may be intentionally skipped; failures must still block publication.
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' && needs.server.result == 'success' &&
      needs.windows-tests.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true
      - name: Merge reused files and verify complete release
        run: |
          # Artifact uploads omit empty directories on full rebuilds.
          mkdir -p release-plan/reused
          cp -R release-plan/reused/. artifacts/
          python3 scripts/release/release.py finalize
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.sha }}
        # Manual runs create the version tag at the exact built commit. Tags made
        # with GITHUB_TOKEN do not trigger another tag-push workflow.
        run: >-
          gh release create "$TAG" artifacts/* --target "$COMMIT" --prerelease
          --title "Agenterm $TAG" --notes-file release-plan/notes.md --generate-notes
