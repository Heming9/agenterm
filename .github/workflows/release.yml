name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
      - name: Build client
        run: |
          cd cmd/agenterm-gui
          "$(go env GOPATH)/bin/fyne" package -os darwin --use-raw-icon --release
          ditto -c -k --keepParent Agenterm.app ../../agenterm-client-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: agenterm-client-macos-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - name: Test Windows installer and connection probes
        run: go test ./cmd/agenterm-server -run 'TestPowerShellInvitationInstaller|TestProbe|TestReleaseDownloads|TestInstallWrapper|TestConnectionVersion'
      - name: Test Windows connection locks
        run: go test ./internal/client -run 'TestConnectionLock|TestConcurrentConnection|TestDuplicateInvitations|TestInvitationConnection'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Add C compiler to PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
      - name: Build client
        shell: pwsh
        run: |
          Set-Location cmd/agenterm-gui
          & "$(go env GOPATH)/bin/fyne.exe" package -os windows -icon assets/app-icon-windows.png --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item Agenterm.exe ../../agenterm-client-windows-amd64.exe
          Compress-Archive -Path ../../agenterm-client-windows-amd64.exe -DestinationPath ../../agenterm-client-windows-amd64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            agenterm-client-windows-amd64.exe
            agenterm-client-windows-amd64.zip
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - name: Test CLI, server, and installers
        run: go test ./cmd/agenterm-client ./cmd/agenterm-server ./internal/...
      - name: Build and bundle clients, then build servers
        env:
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._+-]+$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          source_version=$(sed -n 's/^const Current = "\([^"]*\)"$/\1/p' internal/version/version.go)
          [ "$RELEASE_TAG" = "v$source_version" ] || { echo 'Release tag must match internal/version.Current' >&2; exit 1; }
          mkdir -p dist
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              platform="$os"
              extension=""
              if [ "$os" = darwin ]; then platform=macos; fi
              if [ "$os" = windows ]; then extension=.exe; fi
              name="agenterm-cli-${platform}-${arch}${extension}"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "dist/$name" ./cmd/agenterm-client
              if [ "$os" = windows ]; then
                (cd dist && zip -9 -q "${name%.exe}.zip" "$name")
              else
                tar -C dist -cf - "$name" | gzip -9 > "dist/${name}.tar.gz"
              fi
            done
          done
          # The embedded manifest covers both the archives and extracted clients.
          (cd dist && sha256sum agenterm-cli-* > SHA256SUMS)
          cp dist/*.tar.gz dist/*.zip dist/SHA256SUMS internal/installer/assets/
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              platform="$os"
              extension=""
              if [ "$os" = darwin ]; then platform=macos; fi
              if [ "$os" = windows ]; then extension=.exe; fi
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.releaseTag=$RELEASE_TAG" -o "dist/agenterm-server-${platform}-${arch}${extension}" ./cmd/agenterm-server
            done
          done
          sed "s/@RELEASE_TAG@/$RELEASE_TAG/g" internal/installer/install.sh > dist/install.sh
          sed "s/@RELEASE_TAG@/$RELEASE_TAG/g" internal/installer/install.ps1 > dist/install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [macos, windows, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && rm SHA256SUMS && sha256sum * > ../SHA256SUMS && mv ../SHA256SUMS .)
          gh release create "$TAG" artifacts/* --verify-tag --prerelease --title "Agenterm $TAG" --notes "$(cat <<'EOF'
          Agenterm preview release.

          - Prevent duplicate connections to the same server address under the same OS account, including different invitations and CLI/GUI combinations. Acquire a shared local OS file lock before redeeming an invitation, and release it on disconnect or process termination.
          - Show remote control authorization separately before connection progress. After confirmation, proceed through four stages without asking again: connectivity check, client preparation, connecting, and connected.
          - Use single spaces in command prefixes and one blank line between command blocks in both the GUI and terminal interface.
          - Remove extra blank lines at the edges of command output while preserving interior blank lines, indentation, and automatic wrapping. Keep streaming and concurrent output correctly separated, including commands without a final newline.
          - Show a green 已连接 status in the terminal header after connecting; connection-stage progress remains available during setup and in the connection log.
          - All HTTP and WebSocket endpoints now share the /agenterm/ prefix: MCP, client connections, invitation redemption, short installation URLs, and downloads. Reverse proxies need just one route, preserving the prefix.
          - Breaking change: previous root endpoints and token formats are unsupported. Update Server and Client (including the GUI) together, configure MCP at /agenterm/mcp, and generate new tokens/invitations.
          - Enforce version compatibility during probes, invitation redemption, and WebSocket connection: stable 1.0+ versions require matching majors; 0.x requires matching minors (0.0.x also requires matching patches). Prereleases require the same core and prerelease identifiers; build metadata is ignored. Missing or malformed version information is rejected before registering a connection or redeeming an invitation.
          - The public-url option accepts an origin or an address ending in /agenterm; generated URLs always include the prefix exactly once.
          - One-command connection no longer accesses GitHub: each Server bundles CLI archives and checksums for macOS, Linux, and Windows (amd64 and arm64), serving compressed files directly.
          - Short invitation URLs dynamically provide the installer with its version, invitation, and download address. Invitations remain valid for 15 minutes and redeemable once; fetching scripts does not consume them.
          - Check invitation validity and the actual WebSocket handshake before downloading a client. Failed probes stop installation immediately.
          - Show terminal download progress. Verified cached clients skip downloading; connection success is shown only after the real handshake.
          - GUI downloads remain available for macOS arm64 and Windows amd64. CLI clients retain the interactive TUI and optional -plain mode.

          All endpoints now use /agenterm/. Reverse proxies only need to forward this prefix unchanged, with WebSocket upgrades and the Authorization header enabled. Update Server and Client (including the GUI) together, regenerate tokens, and use /agenterm/mcp. Previous root endpoints and token formats are unsupported.

          HTTP and WebSocket traffic is unencrypted by default; use only on a trusted network. See the README for setup and security details.
          EOF
          )"
