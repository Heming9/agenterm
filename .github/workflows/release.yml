name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
      - name: Build app and server
        run: |
          cd cmd/agenterm-gui
          "$(go env GOPATH)/bin/fyne" package -os darwin
          ditto -c -k --keepParent Agenterm.app ../../Agenterm-macOS-arm64.zip
          cd ../..
          go build -o agenterm-server-macos-arm64 ./cmd/agenterm-server
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Agenterm-macOS-arm64.zip
            agenterm-server-macos-arm64
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Add C compiler to PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.2
      - name: Build app and server
        shell: pwsh
        run: |
          Set-Location cmd/agenterm-gui
          & "$(go env GOPATH)/bin/fyne.exe" package -os windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item Agenterm.exe ../../Agenterm-Windows-amd64.exe
          Set-Location ../..
          go build -o agenterm-server-windows-amd64.exe ./cmd/agenterm-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Agenterm-Windows-amd64.exe
            agenterm-server-windows-amd64.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* --verify-tag --prerelease --title "Agenterm $TAG" --notes "First preview release of Agenterm. The MCP endpoint has no authentication; use only on a trusted network. See the README for setup and security details."
