name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Programs to rebuild (CLI also rebuilds Server)'
        type: choice
        default: all
        options: [all, server, client, cli]
      base_tag:
        description: 'Reuse from this release; blank selects latest published ancestor'
        type: string
        default: ''
      source_ref:
        description: 'Source commit or tag to rebuild; blank uses the workflow ref'
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      cli: ${{ steps.plan.outputs.cli }}
      server: ${{ steps.plan.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Resolve requested source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ -n "$SOURCE_REF" ]; then
            source_sha=$(git rev-parse --verify --end-of-options "${SOURCE_REF}^{commit}")
            git checkout --detach "$source_sha"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Test release planning
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Select builds and verify reused downloads
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCOPE: ${{ inputs.scope || 'all' }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: python3 scripts/release/release.py prepare --scope "$SCOPE" --base "$BASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan/
          if-no-files-found: error

  checks:
    needs: plan
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: ${{ needs.plan.outputs.sha }}

  cli:
    needs: plan
    if: needs.plan.outputs.cli == 'true'
    name: Rust CLI / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Rust tools
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target '${{ matrix.target }}'
          rustup default 1.99.1
      - name: Install Linux TLS build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Build native Rust CLI
        run: python scripts/build_client.py --target '${{ matrix.target }}' --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/agenterm-client-cli-*
          if-no-files-found: error

  p2p:
    # Build in parallel with checks; publish still requires both to succeed.
    needs: [plan]
    if: needs.plan.outputs.server == 'true'
    uses: ./.github/workflows/p2p-cli.yml
    with:
      source_ref: ${{ needs.plan.outputs.sha }}
      skip_checks: true

  server:
    needs: [plan, p2p, cli]
    if: always() && !cancelled() && needs.plan.result == 'success' && (needs.p2p.result == 'success' || needs.p2p.result == 'skipped') && (needs.cli.result == 'success' || needs.cli.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-plan
      - name: Restore reusable CLI and Server files
        shell: bash
        run: |
          mkdir -p dist
          for asset in release-plan/reused/agenterm-client-cli-* release-plan/reused/agenterm-server-*; do
            [ ! -f "$asset" ] || cp "$asset" dist/
          done
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.server == 'true'
        with:
          name: p2p-cli-distribution
          path: component-builds/p2p-assets
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.cli == 'true'
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Bundle Rust CLI and build servers
        if: needs.plan.outputs.server == 'true'
        env:
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._+-]+$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          source_version=$(sed -n 's/^const Current = "\([^"]*\)"$/\1/p' internal/version/version.go)
          [ "$RELEASE_TAG" = "v$source_version" ] || { echo 'Release tag must match internal/version.Current' >&2; exit 1; }
          client_version=$(python3 -c 'import json; print(json.load(open("release-plan/release-manifest.json"))["components"]["cli"]["version"])')
          python3 scripts/build_components.py --client-dir dist --client-version "$client_version" --p2p-assets component-builds/p2p-assets --download-output "$RUNNER_TEMP/cli-downloads"
          python3 scripts/build_server.py --prepare-only
          AGENTERM_RELEASE_DIR="$RUNNER_TEMP/cli-downloads" go test ./internal/installer -run TestEmbeddedReleaseDownloads -count=1
          # Use the inventory from the selected source ref, including for historical rebuilds.
          PYTHONPATH=scripts/release python3 - <<'PY'
          import os, subprocess
          from release import assets
          for filename in assets("server"):
              _, platform, arch = filename.removesuffix(".exe").rsplit("-", 2)
              env = dict(os.environ, GOOS="darwin" if platform == "macos" else platform, GOARCH=arch)
              subprocess.run(["go", "build", "-trimpath", "-ldflags", "-s -w",
                              "-o", f"dist/{filename}", "./cmd/agenterm-server"], env=env, check=True)
          PY
      - name: Stage raw executables for publication
        run: python3 scripts/release/release.py stage --directory dist --output release-files --components cli server
      - name: Report artifact sizes
        run: |
          {
            printf '| Executable | Bytes |\n| --- | ---: |\n'
            for artifact in release-files/*; do
              printf '| %s | %s |\n' "$(basename "$artifact")" "$(wc -c < "$artifact" | tr -d ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: build-server
          path: release-files/*
          if-no-files-found: error

  publish:
    needs: [plan, checks, server]
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' && needs.server.result == 'success' &&
      needs.checks.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true
      - name: Merge reused files and verify complete release
        run: |
          # Artifact uploads omit empty directories on full rebuilds.
          mkdir -p release-plan/reused
          cp -R release-plan/reused/. artifacts/
          python3 scripts/release/release.py finalize
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.sha }}
        # Manual runs create the version tag at the exact built commit. Tags made
        # with GITHUB_TOKEN do not trigger another tag-push workflow.
        run: >-
          gh release create "$TAG" artifacts/* --target "$COMMIT" --prerelease
          --title "Agenterm $TAG" --notes-file release-plan/notes.md --generate-notes
