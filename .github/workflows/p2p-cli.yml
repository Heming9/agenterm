name: P2P CLI

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/p2p-cli/**'
      - 'internal/p2p/**'
      - 'internal/client/**'
      - 'internal/protocol/**'
      - 'internal/service/**'
      - 'internal/components/**'
      - 'internal/installer/**'
      - 'cmd/agenterm-pack/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build_components.py'
      - 'scripts/build_p2p_cli.py'
      - 'scripts/build_server.py'
      - 'scripts/test_*.py'
      - 'scripts/release/**'
      - '.github/workflows/p2p-cli.yml'
      - '.github/workflows/release.yml'
  push:
    paths:
      - 'tools/p2p-cli/**'
      - 'internal/p2p/**'
      - 'internal/client/**'
      - 'internal/protocol/**'
      - 'internal/service/**'
      - 'internal/components/**'
      - 'internal/installer/**'
      - 'cmd/agenterm-pack/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build_components.py'
      - 'scripts/build_p2p_cli.py'
      - 'scripts/build_server.py'
      - 'scripts/test_*.py'
      - 'scripts/release/**'
      - '.github/workflows/p2p-cli.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust tools
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Check and build native component
        shell: bash
        run: |
          cargo fmt --manifest-path tools/p2p-cli/Cargo.toml --check
          cargo clippy --manifest-path tools/p2p-cli/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/p2p-cli/Cargo.toml --locked
          cargo build --manifest-path tools/p2p-cli/Cargo.toml --release --locked
          python scripts/build_p2p_cli.py --output dist/p2p-assets
      - name: Test component extraction, downloads, and build scripts
        shell: bash
        run: |
          go test ./internal/components ./internal/installer
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Exercise persistent connections and builtin bootstrap
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          binary = pathlib.Path('tools/p2p-cli/target/release') / ('p2p-cli.exe' if os.name == 'nt' else 'p2p-cli')
          subprocess.run(['python', 'tools/p2p-cli/daemon_e2e.py', str(binary)], check=True)
          env = dict(os.environ, P2P_CLI_TEST_BINARY=str(binary.resolve()), P2P_CLI_TEST_ASSETS=str(pathlib.Path('dist/p2p-assets').resolve()))
          subprocess.run(['go', 'test', './internal/client', './internal/p2p', './internal/service', '-run', 'TestP2P|TestManifest', '-count=1'], env=env, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-cli-${{ runner.os }}-${{ runner.arch }}
          path: dist/p2p-assets/*
          if-no-files-found: error

  distribution:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: p2p-cli-*
          path: component-builds
      - name: Merge native archives and checksums
        run: python3 scripts/build_p2p_cli.py --merge component-builds/* --output dist/p2p-assets
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-cli-distribution
          path: dist/p2p-assets/*
          if-no-files-found: error
