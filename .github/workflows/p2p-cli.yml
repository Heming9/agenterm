name: P2P CLI

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/p2p-cli/**'
      - 'internal/p2p/**'
      - 'internal/client/**'
      - 'internal/protocol/**'
      - 'internal/service/**'
      - 'internal/components/**'
      - 'internal/installer/**'
      - 'cmd/agenterm-pack/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build_components.py'
      - 'scripts/build_p2p_cli.py'
      - 'scripts/build_server.py'
      - 'scripts/test_*.py'
      - 'scripts/release/**'
      - '.github/workflows/p2p-cli.yml'
      - '.github/workflows/release.yml'
  push:
    paths:
      - 'tools/p2p-cli/**'
      - 'internal/p2p/**'
      - 'internal/client/**'
      - 'internal/protocol/**'
      - 'internal/service/**'
      - 'internal/components/**'
      - 'internal/installer/**'
      - 'cmd/agenterm-pack/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build_components.py'
      - 'scripts/build_p2p_cli.py'
      - 'scripts/build_server.py'
      - 'scripts/test_*.py'
      - 'scripts/release/**'
      - '.github/workflows/p2p-cli.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
            extension: ''
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            extension: ''
          - os: macos-15-intel
            platform: macos
            arch: amd64
            target: x86_64-apple-darwin
            extension: ''
          - os: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            extension: ''
          - os: windows-2025
            platform: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            extension: .exe
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      P2P_CLI_BINARY: tools/p2p-cli/target/${{ matrix.target }}/release/p2p-cli${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux static-link tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install pinned Rust tools
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target '${{ matrix.target }}'
          rustup default 1.99.1
      - name: Check and build native component
        shell: bash
        run: |
          cargo fmt --manifest-path tools/p2p-cli/Cargo.toml --check
          if [ '${{ matrix.platform }}' = linux ]; then
            export CC=musl-gcc
          fi
          if [ '${{ matrix.platform }}' = windows ]; then
            export RUSTFLAGS='-C target-feature=+crt-static'
          fi
          cargo clippy --manifest-path tools/p2p-cli/Cargo.toml --all-targets --target '${{ matrix.target }}' --locked -- -D warnings
          cargo test --manifest-path tools/p2p-cli/Cargo.toml --target '${{ matrix.target }}' --locked
          cargo build --manifest-path tools/p2p-cli/Cargo.toml --release --target '${{ matrix.target }}' --locked
          python scripts/build_p2p_cli.py --target '${{ matrix.target }}' --binary "$P2P_CLI_BINARY" --output dist/p2p-assets
      - name: Test component extraction, downloads, and build scripts
        shell: bash
        run: |
          go test ./internal/components ./internal/installer
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Exercise persistent connections and builtin bootstrap
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          binary = pathlib.Path(os.environ['P2P_CLI_BINARY'])
          subprocess.run(['python', 'tools/p2p-cli/daemon_e2e.py', str(binary)], check=True)
          env = dict(os.environ, P2P_CLI_TEST_BINARY=str(binary.resolve()), P2P_CLI_TEST_ASSETS=str(pathlib.Path('dist/p2p-assets').resolve()))
          subprocess.run(['go', 'test', './internal/client', './internal/p2p', './internal/service', '-run', 'TestP2P|TestManifest', '-count=1'], env=env, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/p2p-assets/*
          if-no-files-found: error

  distribution:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: p2p-cli-*
          path: component-builds
      - name: Merge native executables and checksums
        run: python3 scripts/build_p2p_cli.py --merge component-builds/* --require-all --output dist/p2p-assets
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-cli-distribution
          path: dist/p2p-assets/*
          if-no-files-found: error
