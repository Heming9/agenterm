services:
  server:
    build: .
    image: agenterm-server:local
    restart: unless-stopped
    environment:
      AGENTERM_LOG_FORMAT: "${AGENTERM_LOG_FORMAT:-json}"
      AGENTERM_LOG_LEVEL: "${AGENTERM_LOG_LEVEL:-INFO}"
      AGENTERM_RUNTIME_LOG_FILE: stderr
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "${AGENTERM_BIND_ADDRESS:-127.0.0.1}:${AGENTERM_PORT:-8080}:8080"
    command:
      - -listen
      - 0.0.0.0:8080
      - -public-url
      - "${AGENTERM_PUBLIC_URL:?Set AGENTERM_PUBLIC_URL in .env}"
      - -passwd
      - "${AGENTERM_MANAGEMENT_KEY:?Set AGENTERM_MANAGEMENT_KEY in .env}"
    healthcheck:
      test: ["CMD", "/agenterm-server", "status"]
      start_period: 90s
      interval: 5s
      timeout: 4s
      retries: 5
    # Only IPC sockets are written here; session state stays in process memory.
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 80s
