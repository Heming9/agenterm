[package]
name = "agenterm-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
ctrlc = "3"
fs2 = "0.4"
getrandom = "0.4"
httparse = "1"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
