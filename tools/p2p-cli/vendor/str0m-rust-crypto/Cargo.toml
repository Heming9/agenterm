[package]
name = "str0m-rust-crypto"
version = "0.6.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
dimpl = { version = "0.7.1", default-features = false, features = ["rust-crypto"] }
hmac = "0.12.1"
p256 = { version = "0.13", features = ["ecdh"] }
rcgen = { version = "0.14.10", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
str0m-proto = { version = "0.7.0", default-features = false, features = ["dtls"] }
time = "0.3"
