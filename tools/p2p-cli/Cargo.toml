[package]
name = "p2p-cli"
version = "0.1.2"
edition = "2024"

[dependencies]
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
serde_json = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ctrlc = "3"
if-addrs = "0.14"
fs2 = "0.4"
hostname = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# CLI panics terminate the process; ordinary Result errors retain cleanup paths.
panic = "abort"
